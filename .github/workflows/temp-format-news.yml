name: Temporary format news pages
on:
  push:
    branches:
      - feat/public-news-pages
    paths:
      - .github/workflows/temp-format-news.yml
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/public-news-pages
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Format files
        run: |
          npx prettier --write "src/app/berita/[slug]/page.tsx" src/app/berita/berita.module.css src/app/berita/page.tsx src/app/page.tsx
          echo "=== SLUG PAGE ==="
          cat "src/app/berita/[slug]/page.tsx"
          echo "=== CSS ==="
          cat src/app/berita/berita.module.css
          echo "=== ARCHIVE ==="
          cat src/app/berita/page.tsx
          echo "=== HOME ==="
          cat src/app/page.tsx
