name: CI

# Setiap PR ke main dan setiap push ke branch kerja harus melewati quality gate
# yang sama. Push langsung ke main tidak memicu workflow karena main dilindungi.
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
    tags-ignore: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Unit test dan quality check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependency
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit test
        run: npm test

  integration:
    name: Integration test (MySQL 8)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        # MySQL 8 disposable; database hanya hidup selama job ini.
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: uji_ci_root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: desa_test_ci
        ports:
          - 3306:3306
        # GitHub menunggu health check lulus sebelum menjalankan step.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -puji_ci_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=15s

    env:
      NODE_ENV: test
      TEST_DATABASE_ACK: "1"
      TEST_DATABASE_URL: mysql://root:uji_ci_root@127.0.0.1:3306/desa_test_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependency
        run: npm ci

      # Guard membaca TEST_DATABASE_URL + ACK dari environment di atas dan
      # menolak host non-loopback / nama di luar desa_test*. DATABASE_URL diisi
      # oleh src/testing/setup-integration.ts dari DSN yang sudah divalidasi.
      - name: Integration test
        run: npm run test:integration

  visual-login:
    name: Visual QA login (desktop/mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: development
      APP_URL: http://127.0.0.1:3000
      DATABASE_URL: mysql://visual:visual@127.0.0.1:3306/visual_placeholder
      BETTER_AUTH_SECRET: visual-qa-only-secret-that-is-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependency
        run: npm ci

      - name: Install Chromium
        run: npx --yes playwright install --with-deps chromium

      - name: Start Next.js
        run: |
          npm run build > /tmp/flexidesa-build.log 2>&1
          npm run start -- --hostname 127.0.0.1 > /tmp/flexidesa-next.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/masuk > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/flexidesa-build.log || true
          cat /tmp/flexidesa-next.log || true
          exit 1

      - name: Capture desktop
        run: |
          mkdir -p artifacts
          npx --yes playwright screenshot --browser chromium --viewport-size "1440,1000" --full-page http://127.0.0.1:3000/masuk artifacts/login-desktop.png

      - name: Capture mobile
        run: |
          npx --yes playwright screenshot --browser chromium --viewport-size "390,844" --full-page http://127.0.0.1:3000/masuk artifacts/login-mobile.png

      - name: Include design reference
        if: always()
        run: |
          mkdir -p artifacts
          cp "docs/account/Modern Indonesian Village Login Portal.png" artifacts/reference-login.png

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flexidesa-login-visual-qa
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 7

  summary:
    name: Ringkasan CI
    runs-on: ubuntu-latest
    needs: [quality, integration, visual-login]
    if: always()
    steps:
      - name: Tulis ringkasan
        run: |
          {
            echo "## Ringkasan CI"
            echo ""
            echo "| Job | Hasil |"
            echo "|---|---|"
            echo "| Unit/quality | ${{ needs.quality.result }} |"
            echo "| Integration | ${{ needs.integration.result }} |"
            echo "| Visual QA login | ${{ needs.visual-login.result }} |"
            echo ""
            if [ "${{ needs.quality.result }}" != "success" ] || [ "${{ needs.integration.result }}" != "success" ] || [ "${{ needs.visual-login.result }}" != "success" ]; then
              echo "**Status keseluruhan: GAGAL**"
            else
              echo "**Status keseluruhan: LULUS**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tegakkan status keseluruhan
        if: needs.quality.result != 'success' || needs.integration.result != 'success' || needs.visual-login.result != 'success'
        run: exit 1
