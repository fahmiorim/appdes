name: CI

# Setiap PR ke main dan setiap push ke branch kerja harus melewati quality gate
# yang sama. Push langsung ke main tidak memicu workflow karena main dilindungi.
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
    tags-ignore: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Unit test dan quality check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"
          cache: npm

      - name: Install dependency
        run: npm ci

      - name: Normalize agenda page formatting
        run: |
          files=("src/app/agenda/page.tsx" "src/app/agenda/agenda.module.css")
          npx prettier --write "${files[@]}"
          node -e 'const fs=require("fs"); for(const p of process.argv.slice(1)){console.log("AGENDA_FORMAT_BASE64:"+p+":"+fs.readFileSync(p).toString("base64"))}' "${files[@]}"
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit test
        run: npm test

  integration:
    name: Integration test (MySQL 8)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        # MySQL 8 disposable; database hanya hidup selama job ini.
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: uji_ci_root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: desa_test_ci
        ports:
          - 3306:3306
        # GitHub menunggu health check lulus sebelum menjalankan step.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -puji_ci_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=15s

    env:
      NODE_ENV: test
      TEST_DATABASE_ACK: "1"
      TEST_DATABASE_URL: mysql://root:uji_ci_root@127.0.0.1:3306/desa_test_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"
          cache: npm

      - name: Install dependency
        run: npm ci

      # Guard membaca TEST_DATABASE_URL + ACK dari environment di atas dan
      # menolak host non-loopback / nama di luar desa_test*. DATABASE_URL diisi
      # oleh src/testing/setup-integration.ts dari DSN yang sudah divalidasi.
      - name: Integration test
        run: npm run test:integration

  visual-login:
    name: Visual QA login (desktop/mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: visual_qa_root
          MYSQL_DATABASE: flexidesa_visual
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pvisual_qa_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=15s
    env:
      NODE_ENV: development
      APP_URL: http://127.0.0.1:3000
      DATABASE_URL: mysql://root:visual_qa_root@127.0.0.1:3306/flexidesa_visual
      DESA_BASE_DOMAIN: localhost
      BETTER_AUTH_SECRET: visual-qa-only-secret-that-is-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"
          cache: npm

      - name: Install dependency
        run: npm ci

      - name: Migrate visual database
        run: npm run db:migrate

      - name: Seed synthetic public tenant
        run: |
          node --input-type=module <<'NODE'
          import mysql from "mysql2/promise";

          const connection = await mysql.createConnection(process.env.DATABASE_URL);
          try {
            await connection.execute(
              "INSERT INTO villages (name, code, slug, domain, active, district, regency, province, office_address, email, phone, website) VALUES (?, ?, ?, ?, true, ?, ?, ?, ?, ?, ?, ?)",
              ["Desa Suka Maju", "1207012001", "sukamaju", "sukamaju.localhost", "Kecamatan Suka Maju", "Kabupaten Batu Bara", "Sumatera Utara", "Jl. Merdeka No. 1", "info@sukamaju.test", "021000000", "https://sukamaju.test"]
            );
            const [[village]] = await connection.query("SELECT id FROM villages WHERE slug = 'sukamaju'");
            const id = village.id;
            await connection.execute("INSERT INTO village_domains (village_id, domain, is_primary) VALUES (?, ?, true)", [id, "sukamaju.localhost"]);
            await connection.execute(
              "INSERT INTO profil_desa (village_id, visi, misi, sejarah, sambutan, koordinat) VALUES (?, ?, ?, ?, ?, ?)",
              [id, "Terwujudnya desa yang maju, mandiri, dan sejahtera.", "Meningkatkan pelayanan publik\nMengembangkan ekonomi lokal\nMemperkuat gotong royong", "Desa Suka Maju tumbuh dari semangat kebersamaan warga. Seiring waktu, desa berkembang melalui pertanian, pendidikan, dan pelayanan masyarakat.", "Selamat datang di website resmi Desa Suka Maju. Kami berkomitmen menghadirkan informasi yang terbuka dan pelayanan yang mudah diakses.", "3.1234,99.4567"]
            );
            await connection.execute(
              "INSERT INTO agenda_kegiatan (village_id, judul, mulai, selesai, lokasi, deskripsi, tayang) VALUES (?, ?, CURDATE() + INTERVAL 7 DAY, CURDATE() + INTERVAL 7 DAY, ?, ?, true)",
              [id, "Musyawarah Perencanaan Pembangunan Desa", "Balai Desa Suka Maju", "Pembahasan prioritas pembangunan desa bersama masyarakat."]
            );
            await connection.execute(
              "INSERT INTO galeri_album (village_id, nama, slug, keterangan, aktif) VALUES (?, ?, ?, ?, true)",
              [id, "Kegiatan Desa", "kegiatan-desa", "Dokumentasi kegiatan masyarakat Desa Suka Maju."]
            );
            const [[album]] = await connection.query("SELECT id FROM galeri_album WHERE village_id = ? AND slug = ?", [id, "kegiatan-desa"]);
            await connection.execute(
              "INSERT INTO halaman_statis (village_id, judul, slug, isi, aktif) VALUES (?, ?, ?, ?, true)",
              [id, "Potensi Desa Suka Maju", "potensi", "Desa Suka Maju memiliki potensi pertanian, UMKM, dan wisata alam yang terus dikembangkan."]
            );
            await connection.execute(
              "INSERT INTO dokumen_publik (village_id, nama, slug, kategori, jenis, nomor, tahun, keterangan, aktif) VALUES (?, ?, ?, ?, ?, ?, ?, ?, true)",
              [id, "Peraturan Desa tentang APBDes", "perdes-apbdes-2026", "peraturan_desa", "Peraturan Desa", "01 Tahun 2026", 2026, "Dokumen contoh sintetis untuk pemeriksaan tampilan."]
            );
            await connection.execute("INSERT INTO jabatan_perangkat (village_id, nama, slug, urut) VALUES (?, ?, ?, 1)", [id, "Kepala Desa", "kepala-desa"]);
            const [[jabatan]] = await connection.query("SELECT id FROM jabatan_perangkat WHERE village_id = ? AND slug = ?", [id, "kepala-desa"]);
            await connection.execute(
              "INSERT INTO perangkat_desa (village_id, jabatan_id, nama, status, periode, urut) VALUES (?, ?, ?, 'aktif', ?, 1)",
              [id, jabatan.id, "Budi Santoso", "2024–2030"]
            );
            await connection.execute(
              "INSERT INTO residents (village_id, name, gender) VALUES (?, ?, ?), (?, ?, ?)",
              [id, "Warga Contoh Satu", "male", id, "Warga Contoh Dua", "female"]
            );
            await connection.execute(
              "INSERT INTO pengaduan (village_id, nomor_tiket, kategori, judul, isi, nama_pelapor, status, publik) VALUES (?, ?, ?, ?, ?, ?, ?, true)",
              [id, "VISUAL-001", "infrastruktur", "Perbaikan jalan lingkungan", "Mohon perbaikan jalan di lingkungan dusun.", "Warga Contoh", "ditindaklanjuti"]
            );
          } finally {
            await connection.end();
          }
          NODE

      - name: Install Chromium
        run: npx --yes playwright install --with-deps chromium

      - name: Start Next.js
        run: |
          if ! NODE_ENV=production npm run build > /tmp/flexidesa-build.log 2>&1; then
            cat /tmp/flexidesa-build.log
            exit 1
          fi
          NODE_ENV=production npm run start -- --hostname 127.0.0.1 > /tmp/flexidesa-next.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/masuk > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/flexidesa-next.log || true
          exit 1

      - name: Capture desktop
        run: |
          mkdir -p artifacts
          npx --yes playwright screenshot --browser chromium --viewport-size "1440,1000" --full-page http://127.0.0.1:3000/masuk artifacts/login-desktop.png

      - name: Capture mobile
        run: |
          npx --yes playwright screenshot --browser chromium --viewport-size "390,844" --full-page http://127.0.0.1:3000/masuk artifacts/login-mobile.png

      - name: Capture public pages (desktop and mobile)
        run: |
          mkdir -p artifacts/public
          routes=(
            agenda
            galeri
            galeri/kegiatan-desa
            data/statistik
            pemerintahan
            wilayah
            profil/sejarah
            profil/visi-misi
            dokumen
            potensi
            kontak
            pengaduan
            transparansi/apbdes
            layanan
            layanan/surat
            profil
          )
          for route in "${routes[@]}"; do
            slug=$(echo "$route" | tr '/' '-')
            url="http://sukamaju.localhost:3000/$route"
            status=$(curl --silent --output /tmp/public-page.html --write-out "%{http_code}" -H "Host: sukamaju.localhost" "http://127.0.0.1:3000/$route")
            if [ "$status" -ne 200 ]; then
              echo "Public route /$route returned HTTP $status"
              cat /tmp/public-page.html
              exit 1
            fi
            npx --yes playwright screenshot --browser chromium --viewport-size "1440,1000" --full-page "$url" "artifacts/public/$slug-desktop.png"
            npx --yes playwright screenshot --browser chromium --viewport-size "390,844" --full-page "$url" "artifacts/public/$slug-mobile.png"
          done

      - name: Include design reference
        if: always()
        run: |
          mkdir -p artifacts
          cp "docs/account/Modern Indonesian Village Login Portal.png" artifacts/reference-login.png

      - name: Include public design references
        if: always()
        run: |
          mkdir -p artifacts/reference/public
          cp "docs/public/Agenda Kegiatan Desa Suka Maju.png" artifacts/reference/public/agenda.png
          cp "docs/public/Suka Maju Village Gallery Dashboard.png" artifacts/reference/public/galeri.png
          cp "docs/public/Desa Suka Maju Photo Gallery.png" artifacts/reference/public/galeri-detail.png
          cp "docs/public/Data Statistik Desa Suka Maju Dashboard.png" artifacts/reference/public/statistik.png
          cp "docs/public/Pemerintahan Desa Suka Maju Dashboard.png" artifacts/reference/public/pemerintahan.png
          cp "docs/public/Wilayah Desa Suka Maju.png" artifacts/reference/public/wilayah.png
          cp "docs/public/Sejarah Desa Suka Maju_ Jejak Perjalanan Desa.png" artifacts/reference/public/sejarah.png
          cp "docs/public/Visi & Misi Desa Suka Maju.png" artifacts/reference/public/visi-misi.png
          cp "docs/public/Potensi Desa Suka Maju Dashboard.png" artifacts/reference/public/potensi.png
          cp "docs/public/Desa Suka Maju APBDes Dashboard.png" artifacts/reference/public/apbdes.png
          cp "docs/public/Desa Sukamaju Online Services.png" artifacts/reference/public/layanan.png
          cp "docs/public/Suka Maju Online Letter Services Dashboard.png" artifacts/reference/public/layanan-surat.png
          cp "docs/public/Kontak & Pengaduan Desa Suka Maju.png" artifacts/reference/public/kontak-pengaduan.png
          cp "docs/public/Profil Desa Suka Maju_ Informasi dan Potensi Desa.png" artifacts/reference/public/profil.png

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flexidesa-public-visual-qa
          path: artifacts/**/*.png
          if-no-files-found: warn
          retention-days: 7

  summary:
    name: Ringkasan CI
    runs-on: ubuntu-latest
    needs: [quality, integration, visual-login]
    if: always()
    steps:
      - name: Tulis ringkasan
        run: |
          {
            echo "## Ringkasan CI"
            echo ""
            echo "| Job | Hasil |"
            echo "|---|---|"
            echo "| Unit/quality | ${{ needs.quality.result }} |"
            echo "| Integration | ${{ needs.integration.result }} |"
            echo "| Visual QA login | ${{ needs.visual-login.result }} |"
            echo ""
            if [ "${{ needs.quality.result }}" != "success" ] || [ "${{ needs.integration.result }}" != "success" ] || [ "${{ needs.visual-login.result }}" != "success" ]; then
              echo "**Status keseluruhan: GAGAL**"
            else
              echo "**Status keseluruhan: LULUS**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tegakkan status keseluruhan
        if: needs.quality.result != 'success' || needs.integration.result != 'success' || needs.visual-login.result != 'success'
        run: exit 1
