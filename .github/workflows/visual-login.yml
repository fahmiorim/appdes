name: Visual QA — Login

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/(auth)/masuk/**"
      - "src/app/globals.css"
      - "src/app/layout.tsx"
      - "public/images/**"
      - "package-lock.json"
      - ".github/workflows/visual-login.yml"

permissions:
  contents: read

concurrency:
  group: visual-login-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture login desktop and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: development
      APP_URL: http://127.0.0.1:3000
      DATABASE_URL: mysql://visual:visual@127.0.0.1:3306/visual_placeholder
      BETTER_AUTH_SECRET: visual-qa-only-secret-that-is-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx --yes playwright install --with-deps chromium

      - name: Start Next.js
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/flexidesa-next.log 2>&1 &
          echo $! > /tmp/flexidesa-next.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/masuk > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/flexidesa-next.log
          exit 1

      - name: Capture desktop
        run: |
          mkdir -p artifacts
          npx --yes playwright screenshot --browser chromium --viewport-size "1440,1000" --full-page http://127.0.0.1:3000/masuk artifacts/login-desktop.png

      - name: Capture mobile
        run: |
          npx --yes playwright screenshot --browser chromium --viewport-size "390,844" --full-page http://127.0.0.1:3000/masuk artifacts/login-mobile.png

      - name: Include design reference
        if: always()
        run: |
          mkdir -p artifacts
          cp "docs/account/Modern Indonesian Village Login Portal.png" artifacts/reference-login.png

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flexidesa-login-visual-qa
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 7
