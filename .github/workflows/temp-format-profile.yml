name: Temporary profile formatter
on:
  push:
    branches:
      - feat/public-village-profile
    paths:
      - '.github/workflows/temp-format-profile.yml'
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/profil/page.tsx src/app/profil/profil.module.css
      - name: Print formatted TSX
        run: cat src/app/profil/page.tsx
      - name: Print formatted CSS
        run: cat src/app/profil/profil.module.css
