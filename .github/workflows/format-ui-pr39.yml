name: Format UI PR 39

on:
  push:
    branches:
      - feat/ui-foundation-admin-shell
    paths:
      - .github/workflows/format-ui-pr39.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/ui-foundation-admin-shell
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format only PR 39 files
        run: |
          npx prettier --write             'src/app/(admin)/beranda/page.tsx'             'src/app/(admin)/layout.tsx'             'src/app/(auth)/masuk/login-form.tsx'             'src/app/(auth)/masuk/page.tsx'             'src/app/globals.css'             'src/components/shell/admin-sidebar.tsx'             'src/components/shell/admin-topbar.tsx'             'src/lib/auth-client.ts'

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             'src/app/(admin)/beranda/page.tsx'             'src/app/(admin)/layout.tsx'             'src/app/(auth)/masuk/login-form.tsx'             'src/app/(auth)/masuk/page.tsx'             'src/app/globals.css'             'src/components/shell/admin-sidebar.tsx'             'src/components/shell/admin-topbar.tsx'             'src/lib/auth-client.ts'
          git commit -m "style(ui): apply prettier formatting"
          git push origin HEAD:feat/ui-foundation-admin-shell
