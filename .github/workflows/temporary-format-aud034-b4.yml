name: Temporary formatter AUD-034 B4

on:
  push:
    branches:
      - security/AUD-034-tenant-hardening-final

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Install dependencies
        run: npm ci
      - name: Format changed files
        run: |
          npx prettier --write \
            src/db/b4-cascade-relations-composite-fk.integration.test.ts \
            src/db/b4-tenant-migration-guard.integration.test.ts \
            src/db/schema/bumindes.ts \
            src/db/schema/lapak-produk.ts \
            src/db/schema/lapak.ts \
            src/db/schema/pemilihan.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/db/b4-cascade-relations-composite-fk.integration.test.ts \
            src/db/b4-tenant-migration-guard.integration.test.ts \
            src/db/schema/bumindes.ts \
            src/db/schema/lapak-produk.ts \
            src/db/schema/lapak.ts \
            src/db/schema/pemilihan.ts
          git commit -m "style: format AUD-034 B4 changes"
          git push
