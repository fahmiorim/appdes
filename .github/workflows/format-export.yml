name: Temporary format export

on:
  push:
    branches:
      - feat/public-potensi-rich-content

permissions:
  contents: read

jobs:
  format-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"
          cache: npm
      - run: npm ci
      - name: Format affected files
        run: npx prettier --write src/app/potensi/page.tsx src/app/informasi-publik.module.css
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-potensi-files
          path: |
            src/app/potensi/page.tsx
            src/app/informasi-publik.module.css
          retention-days: 1
