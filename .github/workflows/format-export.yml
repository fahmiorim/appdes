name: Temporary format export

on:
  push:
    branches:
      - feat/public-potensi-rich-content

permissions:
  contents: write

jobs:
  format-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"
          cache: npm
      - run: npm ci
      - name: Format affected files
        run: npx prettier --write src/app/potensi/page.tsx src/app/informasi-publik.module.css
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/potensi/page.tsx src/app/informasi-publik.module.css
          if ! git diff --cached --quiet; then
            git commit -m "style(potensi): apply Prettier formatting"
            git push
          fi
