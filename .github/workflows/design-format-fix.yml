name: Design CSS format fix
on:
  push:
    branches:
      - chore/design-audit-and-baseline
    paths:
      - ".github/workflows/design-format-fix.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - run: npm ci
      - name: Format CSS
        run: npx prettier --write src/app/globals.css
      - name: Commit formatted CSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/globals.css
          if ! git diff --cached --quiet; then
            git commit -m "style: format login design tokens and styles [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
