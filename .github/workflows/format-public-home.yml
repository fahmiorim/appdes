name: Format public homepage

on:
  push:
    branches:
      - feat/public-village-homepage

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/public-village-homepage
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Install dependencies
        run: npm ci
      - name: Format homepage files
        run: npx prettier --write src/app/page.tsx src/app/public-home.module.css
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx src/app/public-home.module.css
          git commit -m "style(public): format village homepage"
          git push origin HEAD:feat/public-village-homepage
